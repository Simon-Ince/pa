<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PA Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="bg-comp" aria-hidden="true"></div>
<div class="wrap">
  <header class="banner">
    <div class="wordmark-group">
      <svg class="logo-mark" width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
        <rect x="4" y="4" width="16" height="16" fill="#F0C020" stroke="#121212" stroke-width="2"/>
        <circle cx="26" cy="12" r="8" fill="#D02020" stroke="#121212" stroke-width="2"/>
        <polygon points="10,32 20,14 30,32" fill="#1040C0" stroke="#121212" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <h1 class="wordmark">PA Command Center</h1>
    </div>
    <div class="banner-right">
      <div id="clock" class="clock">--:--:--</div>
      <div class="conn-status">
        <span id="conn-dot" class="dot amber"></span>
        <span id="conn-label">connecting</span>
      </div>
    </div>
  </header>

  <main class="main-stack">
    <section class="panel panel-focus">
      <div class="panel-header">
        <h2 class="panel-title">Focus</h2>
      </div>
      <div class="panel-body">
        <div id="focus-status" class="panel-substatus"></div>
        <div id="focus-list" class="focus-list"></div>
      </div>
    </section>

    <div class="grid-row">
      <section class="panel panel-calendar">
        <div class="panel-header">
          <h2 class="panel-title">Today / Tomorrow</h2>
        </div>
        <div class="panel-body">
          <div id="calendar-status" class="panel-substatus"></div>
          <div id="calendar-list" class="panel-list scroll"></div>
        </div>
      </section>

      <section class="panel panel-tasks">
        <div class="panel-header">
          <h2 class="panel-title">Tasks</h2>
        </div>
        <div class="panel-body">
          <div id="tasks-status" class="panel-substatus"></div>
          <div id="tasks-list" class="panel-list scroll"></div>
        </div>
      </section>

      <section class="panel panel-signal">
        <div class="panel-header">
          <h2 class="panel-title">Signal</h2>
        </div>
        <div class="panel-body">
          <div id="signal-status" class="panel-substatus"></div>
          <div id="signal-count" class="signal-count"></div>
          <div id="signal-list" class="panel-list scroll"></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="statusbar">
    <span id="footer-gmail">inbox: --</span>
    <span id="footer-calendar">calendar: --</span>
    <span id="footer-triage">triage: --</span>
    <span id="footer-tasks">tasks: --</span>
    <span id="footer-reconnect" class="reconnect-flag hidden">RECONNECTING…</span>
  </footer>
</div>

<script src="/static/app.js"></script>
</body>
</html>
